<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jamath Cash Tracker</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <meta name="theme-color" content="#10B981">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <header class="glass-header">
            <div class="header-top">
                <h1>Jamath Tracker</h1>
                <div class="currency-toggle" onclick="toggleCurrency()">
                    <span id="currency-label" class="currency-badge">AED</span>
                    <span class="currency-hint">Tap to switch</span>
                </div>
            </div>

            <div class="dashboard-grid">
                <div class="stat-card glass-card">
                    <span class="stat-label">Total Collected</span>
                    <span class="stat-value text-gradient-green" id="total-collected">0</span>
                    <span class="currency-code" id="total-c-code">AED</span>
                </div>
                <div class="stat-card glass-card">
                    <span class="stat-label">Pending</span>
                    <span class="stat-value text-gradient-red" id="total-pending">0</span>
                    <span class="currency-code" id="total-p-code">AED</span>
                </div>
                <div class="stat-card glass-card">
                    <span class="stat-label">Members</span>
                    <div class="progress-ring-container">
                        <span class="stat-value" id="stats-members">0/0</span>
                    </div>
                </div>
            </div>
        </header>

        <section id="controls" class="controls-section">
            <div class="action-bar glass-card">
                <button onclick="openModal('addMemberModal')" class="btn btn-primary glow-effect">
                    <span class="icon">+</span> Add Member
                </button>
                <button onclick="openModal('importModal')" class="btn btn-secondary">
                    <span class="icon">📥</span> Import
                </button>
            </div>

            <div class="filters-bar">
                <select id="filter-select" onchange="renderApp()" class="glass-input">
                    <option value="all">View All</option>
                    <option value="paid">Paid Only</option>
                    <option value="unpaid">Not Paid Only</option>
                </select>
            </div>
        </section>

        <main id="main-content" class="content-area">
            <!-- List will be rendered here -->
            <div id="member-list" class="member-list"></div>
        </main>

        <section class="export-actions">
            <div class="glass-card padding-sm">
                <button onclick="exportWhatsApp()" class="btn btn-whatsapp">
                    <span>📱</span> Copy for WhatsApp
                </button>
                <button onclick="exportCSV()" class="btn btn-outline margin-top-sm">
                    <span>⬇</span> Export CSV
                </button>
            </div>
        </section>
    </div>

    <!-- Add Member Modal -->
    <div id="addMemberModal" class="modal hidden">
        <div class="modal-backdrop" onclick="closeModal('addMemberModal')"></div>
        <div class="modal-content glass-modal zoom-in">
            <div class="modal-header">
                <h3 id="modal-title">Add New Member</h3>
                <button class="close-btn" onclick="closeModal('addMemberModal')">&times;</button>
            </div>

            <div class="form-group">
                <label>Name</label>
                <input type="text" id="new-member-name" placeholder="Enter Name" class="glass-input">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Amount (<span id="input-currency-label">AED</span>)</label>
                    <input type="number" id="new-member-amount" value="200" class="glass-input">
                </div>
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="new-member-date" class="glass-input">
                </div>
            </div>

            <div class="modal-actions">
                <button onclick="closeModal('addMemberModal')" class="btn btn-text">Cancel</button>
                <button onclick="addNewMember()" class="btn btn-primary glow-effect">Save Member</button>
            </div>
        </div>
    </div>

    <!-- Import Modal -->
    <div id="importModal" class="modal hidden">
        <div class="modal-backdrop" onclick="closeModal('importModal')"></div>
        <div class="modal-content glass-modal zoom-in">
            <div class="modal-header">
                <h3>Import List</h3>
                <button class="close-btn" onclick="closeModal('importModal')">&times;</button>
            </div>
            <p class="hint">Paste names list below (one name per line)</p>
            <textarea id="import-text" rows="8" placeholder="Name 1&#10;Name 2&#10;Name 3"
                class="glass-input"></textarea>

            <div class="modal-actions">
                <button onclick="closeModal('importModal')" class="btn btn-text">Cancel</button>
                <button onclick="processImport()" class="btn btn-primary glow-effect">Import</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
